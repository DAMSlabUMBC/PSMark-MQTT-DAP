# Stock baseline broker config (eclipse-mosquitto image) for the paper matrix.
# Container port 1883; the runner maps host 127.0.0.1:18884 onto it, matching
# the baselines' {port, 18884} - the host's pre-existing 1883/1884 brokers
# stay untouched.
listener 1883
allow_anonymous true
log_dest stdout

persistence_location /tmp
plugin /usr/lib/mosquitto_persist_sqlite.so
plugin_opt_flush_period 1