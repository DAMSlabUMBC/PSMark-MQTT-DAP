# DAP broker config for the queuing ablation cells (the dapnv group in
# run-paper-matrix.sh): mosquitto-dap.conf with dap_send_verification false.
listener 1883
allow_anonymous true
# DAP operations ($OP_SYS) are ignored unless enabled
use_metadata_operation_support true
# Send queued data without checking it again
dap_send_verification false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
