# DAP broker config for the single-broker compose stack (paper matrix DAP cells).
# Listener stays on container port 1883 - matching the {port, 1883} in the DAP
# scenarios - and is reached by the runner over the compose network via the
# mosquitto-dap service alias. The HOST-side binding lives in the compose file
# (18883) so nothing collides with brokers already on the host's 1883/1884.
listener 1883
allow_anonymous true
use_metadata_operation_support true
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

persistence_location /tmp
plugin /opt/mqtt_brokers/mqtt-dap-mosquitto/plugins/persist-sqlite/mosquitto_persist_sqlite.so
plugin_opt_flush_period 1
